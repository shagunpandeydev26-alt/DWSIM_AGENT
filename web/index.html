<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWSIM Agent — Chemical Flowsheet Generator</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh;
         display: flex; flex-direction: column; }

  header { background: var(--panel); border-bottom: 1px solid var(--border);
           padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .logo { color: var(--accent); }
  header .spacer { flex: 1; }
  select, button { background: var(--bg); color: var(--text);
           border: 1px solid var(--border); border-radius: 6px;
           padding: 6px 12px; font-size: 13px; cursor: pointer; }
  select:hover, button:hover { border-color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); }

  main { flex: 1; display: flex; overflow: hidden; }
  #chat-col { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px;
         font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1f6feb33; border: 1px solid #1f6feb66; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; font-size: 12px; color: var(--muted); background: none; border: none; }

  .msg pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
             padding: 10px; overflow-x: auto; font-size: 12px; margin-top: 8px;
             font-family: 'Cascadia Code', Consolas, monospace; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
           margin-right: 6px; font-weight: 600; }
  .badge.ok { background: #3fb95033; color: var(--green); }
  .badge.err { background: #f8514933; color: var(--red); }
  .badge.warn { background: #d2992233; color: var(--yellow); }
  .badge.info { background: #58a6ff33; color: var(--accent); }

  #input-bar { padding: 14px 20px; border-top: 1px solid var(--border);
               display: flex; gap: 10px; background: var(--panel); }
  #prompt { flex: 1; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 14px; font-size: 14px; resize: none; height: 46px; }
  #send { background: #1f6feb; border: none; color: white; font-weight: 600; padding: 0 24px; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  #detail-col { flex: 1; overflow-y: auto; padding: 16px; font-size: 13px; }
  #detail-col h2 { font-size: 14px; margin: 14px 0 8px; color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .card h3 { font-size: 13px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .mono { font-family: 'Cascadia Code', Consolas, monospace; }
  .muted { color: var(--muted); }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; }
  .spinner { display: inline-block; width: 14px; height: 14px;
             border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1><span class="logo">⚗</span> DWSIM Agent</h1>
  <span id="status">checking…</span>
  <div class="spacer"></div>
  <label class="muted">Model:</label>
  <select id="model"></select>
</header>

<main>
  <div id="chat-col">
    <div id="messages"></div>
    <div id="input-bar">
      <textarea id="prompt" placeholder="e.g. Build me an ammonia synthesis loop with 25% conversion"></textarea>
      <button id="send">Run</button>
    </div>
  </div>
  <div id="detail-col">
    <h2>Run Details</h2>
    <div id="detail-body" class="muted">Attempts, scripts and stream results will appear here after a run.</div>
  </div>
</main>

<script>
const messagesEl = document.getElementById('messages');
const detailEl = document.getElementById('detail-body');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const modelSel = document.getElementById('model');
const statusEl = document.getElementById('status');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}
function addHtml(html, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function init() {
  try {
    const r = await fetch('/api/health');
    const h = await r.json();
    statusEl.textContent = h.gemini_key_set ? '● ready (DWSIM 8.8.2)' : '● GEMINI_API_KEY missing — set it in .env';
    statusEl.style.color = h.gemini_key_set ? '#3fb950' : '#f85149';
  } catch (e) { statusEl.textContent = 'offline'; }

  const r = await fetch('/api/models');
  const m = await r.json();
  m.models.forEach(x => {
    const o = document.createElement('option');
    o.value = x; o.textContent = x;
    if (x === m.default) o.selected = true;
    modelSel.appendChild(o);
  });
}

async function run() {
  const prompt = promptEl.value.trim();
  if (!prompt) return;
  promptEl.value = '';
  sendBtn.disabled = true;

  addMsg(prompt, 'user');
  const wait = addMsg('thinking…', 'system');
  wait.innerHTML = '<span class="spinner"></span> working…';

  try {
    const r = await fetch('/api/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt, model: modelSel.value})
    });
    if (!r.ok) {
      const err = await r.json();
      wait.remove();
      addMsg('Error: ' + (err.detail || JSON.stringify(err)), 'assistant');
      return;
    }
    const data = await r.json();
    wait.remove();
    renderResult(data);
  } catch (e) {
    wait.remove();
    addMsg('Request failed: ' + e.message, 'assistant');
  } finally {
    sendBtn.disabled = false;
  }
}

function renderResult(data) {
  addMsg(data.final_text || '(no final text)', 'assistant');
  renderDetails(data);
}

function renderDetails(data) {
  let html = '';
  const conv = data.last_envelope?.converged;
  const ver = data.last_envelope?.verification;

  html += `<div class="card"><h3>Overview</h3>
    <div class="kv"><span>Model</span><span class="mono">${data.model}</span></div>
    <div class="kv"><span>Attempts</span><span>${data.attempts.length}</span></div>
    <div class="kv"><span>Converged</span><span>${conv ? '<span class="badge ok">YES</span>' : '<span class="badge err">NO</span>'}</span></div>
    ${ver ? `<div class="kv"><span>Verification</span><span>${ver.passed ? '<span class="badge ok">PASSED</span>' : '<span class="badge err">FAILED</span>'}</span></div>` : ''}
  </div>`;

  data.attempts.forEach((a, i) => {
    const env = a.envelope || {};
    const ok = env.converged;
    const verPass = env.verification?.passed;
    html += `<div class="card"><h3>Attempt ${i+1}: ${a.label}
      ${ok ? (verPass !== undefined ? (verPass ? '<span class="badge ok">converged+verified</span>' : '<span class="badge warn">converged, verify-fail</span>') : '<span class="badge ok">converged</span>') : `<span class="badge err">${env.error_class || 'error'}</span>`}
      </h3>
      <pre class="mono">${escapeHtml(a.script)}</pre>`;
    if (env.issues && env.issues.length)
      html += `<div><span class="badge err">issues</span>${escapeHtml(env.issues.join('; ')).substring(0,400)}</div>`;
    if (env.hint) html += `<div class="muted">hint: ${escapeHtml(env.hint)}</div>`;
    html += '</div>';
  });

  if (data.last_envelope?.streams) {
    const streams = data.last_envelope.streams;
    const compounds = Object.keys(Object.values(streams)[0]?.composition || {});
    html += `<div class="card"><h3>Stream Results</h3><table>
      <tr><th>Stream</th><th>T (°C)</th><th>P (bar)</th><th>m (kg/s)</th>
      ${compounds.map(c=>`<th>${c}</th>`).join('')}</tr>`;
    for (const [tag, s] of Object.entries(streams)) {
      html += `<tr><td class="mono">${tag}</td><td>${(s.T_K-273.15).toFixed(1)}</td>
        <td>${(s.P_Pa/1e5).toFixed(1)}</td><td>${s.mass_flow_kg_s?.toFixed(3)}</td>
        ${compounds.map(c=>`<td>${(s.composition[c]??0).toFixed(3)}</td>`).join('')}</tr>`;
    }
    html += '</table>';
    if (data.last_envelope.mass_balance) {
      const mb = data.last_envelope.mass_balance;
      html += `<div class="kv" style="margin-top:8px"><span>Mass balance closure</span>
        <span class="mono">${mb.closure_pct}%</span></div>`;
    }
    html += '</div>';
  }

  if (data.last_envelope?.verification_message) {
    html += `<div class="card"><h3>Verification</h3><pre>${escapeHtml(data.last_envelope.verification_message)}</pre></div>`;
  }

  detailEl.innerHTML = html;
}

function escapeHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

sendBtn.addEventListener('click', run);
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
});
init();
</script>
</body>
</html>
